<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インサイダーゲーム Online</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-gold: #d4af37;
            --text-main: #e0e0e0;
            --text-muted: #888;
            --border-color: #333;
        }
        body {
            font-family: 'Shippori Mincho', serif, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        h1 {
            color: var(--accent-gold);
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 24px;
        }
        .hidden { display: none !important; }
        input, button {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #2a2a2a;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            background: var(--accent-gold);
            color: #121212;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.secondary {
            background: transparent;
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
        }
        .status-box {
            background: #181818;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        ul { padding-left: 20px; margin: 8px 0; }
        li { margin-bottom: 4px; }
        .role-card {
            border: 2px solid var(--accent-gold);
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            background: #1a1a1a;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>インサイダーゲーム Online</h1>

    <!-- 画面1: ロビー選択 -->
    <div id="screen-lobby">
        <input type="text" id="input-name" placeholder="あなたの名前を入力" maxlength="10">
        <button id="btn-create">部屋を作成 (ホスト)</button>
        <button id="btn-join-screen" class="secondary">部屋に参加 (ゲスト)</button>
    </div>

    <!-- 画面2: 参加画面 -->
    <div id="screen-join" class="hidden">
        <input type="text" id="input-room-id" placeholder="ホストのルームIDを入力">
        <button id="btn-connect">参加する</button>
        <button id="btn-back" class="secondary">戻る</button>
    </div>

    <!-- 画面3: 待機ルーム -->
    <div id="screen-waiting" class="hidden">
        <div class="status-box">
            <strong>ルームID:</strong> <span id="display-room-id">--</span><br>
            <span style="font-size: 0.8rem; color: var(--text-muted);">このIDを他のプレイヤーに伝えてください</span>
        </div>
        <h3>参加者一覧</h3>
        <ul id="player-list"></ul>
        <div id="host-controls" class="hidden">
            <input type="text" id="input-word" placeholder="お題を入力 (例: りんご)">
            <button id="btn-start">ゲームスタート</button>
        </div>
        <p id="waiting-msg" class="hidden" style="text-align: center; color: var(--text-muted);">ホストの開始を待っています...</p>
    </div>

    <!-- 画面4: ゲームプレイ画面 -->
    <div id="screen-game" class="hidden">
        <div class="role-card">
            <div style="font-size: 0.8rem; color: var(--accent-gold);">あなたの役職</div>
            <div id="my-role" style="font-size: 1.2rem; font-weight: bold; margin: 4px 0;">--</div>
            <div id="my-word-container" class="hidden">お題: <span id="my-word" style="color: var(--accent-gold); font-weight: bold;">--</span></div>
        </div>
        <div class="status-box" id="game-status-text">
            マスターが出題中です。質問をしてください。
        </div>
        <div id="host-action-area" class="hidden">
            <button id="btn-to-vote">投票フェイズへ進む</button>
        </div>
    </div>
</div>

<script>
    let peer = null;
    let conn = null;
    let connections = []; 
    let myId = '';
    let myName = '';
    let isHost = false;
    let players = []; 
    
    // クライアント側で保持するゲーム結果データ
    let currentRole = '';
    let currentWord = '';

    const $ = id => document.getElementById(id);
    const show = id => $(id).classList.remove('hidden');
    const hide = id => $(id).classList.add('hidden');

    function switchScreen(screenId) {
        ['screen-lobby', 'screen-join', 'screen-waiting', 'screen-game'].forEach(s => hide(s));
        show(screenId);
    }

    $('btn-join-screen').onclick = () => switchScreen('screen-join');
    $('btn-back').onclick = () => switchScreen('screen-lobby');

    $('btn-create').onclick = () => {
        myName = $('input-name').value.trim();
        if (!myName) { alert('名前を入力してください'); return; }

        isHost = true;
        peer = new Peer();
        
        peer.on('open', id => {
            myId = id;
            $('display-room-id').innerText = id;
            players = [{ id: myId, name: myName }];
            updatePlayerList();
            switchScreen('screen-waiting');
            show('host-controls');
        });

        peer.on('connection', c => {
            setupConnection(c);
        });
    };

    $('btn-connect').onclick = () => {
        myName = $('input-name').value.trim();
        const roomId = $('input-room-id').value.trim();
        if (!myName || !roomId) { alert('名前とルームIDを入力してください'); return; }

        isHost = false;
        peer = new Peer();

        peer.on('open', id => {
            myId = id;
            conn = peer.connect(roomId);
            setupConnection(conn);
        });

        peer.on('error', err => {
            alert('接続に失敗しました。IDを確認してください。');
        });
    };

    function setupConnection(connection) {
        if (isHost) {
            connections.push(connection);
            connection.on('data', data => handleHostData(data, connection));
            connection.on('close', () => {
                connections = connections.filter(c => c !== connection);
                players = players.filter(p => p.id !== connection.peer);
                broadcast({ type: 'UPDATE_PLAYERS', players });
                updatePlayerList();
            });
        } else {
            conn = connection;
            connection.on('open', () => {
                connection.send({ type: 'JOIN', name: myName });
                switchScreen('screen-waiting');
                show('waiting-msg');
            });
            connection.on('data', data => handleClientData(data));
            connection.on('close', () => {
                alert('ホストとの接続が切れました。');
                switchScreen('screen-lobby');
            });
        }
    }

    function handleHostData(data, connection) {
        if (data.type === 'JOIN') {
            players.push({ id: connection.peer, name: data.name });
            broadcast({ type: 'UPDATE_PLAYERS', players });
            updatePlayerList();
        }
    }

    function handleClientData(data) {
        if (data.type === 'UPDATE_PLAYERS') {
            players = data.players;
            updatePlayerList();
        } else if (data.type === 'START_GAME') {
            currentRole = data.role;
            currentWord = data.word; // マスター・インサイダーのみお題が入ってくる
            startClientGame();
        }
    }

    function updatePlayerList() {
        const list = $('player-list');
        list.innerHTML = '';
        players.forEach(p => {
            const li = document.createElement('li');
            li.innerText = p.name + (p.id === myId ? ' (自分)' : '');
            list.appendChild(li);
        });
    }

    function broadcast(dataObj) {
        // 各プレイヤー固有の役職やデータを割り振って送信
        connections.forEach(c => {
            const role = dataObj.roles[c.peer];
            const wordToSend = (role === 'マスター' || role === 'インサイダー') ? dataObj.word : '';
            c.send({
                type: 'START_GAME',
                role: role,
                word: wordToSend
            });
        });
    }

    $('btn-start').onclick = () => {
        const word = $('input-word').value.trim();
        if (!word) { alert('お題を入力してください'); return; }
        if (players.length < 3) { alert('遊ぶには最低3人必要です'); return; }

        const shuffled = [...players].sort(() => Math.random() - 0.5);
        const master = shuffled[0];
        const insider = shuffled[1];

        const roles = {};
        players.forEach(p => {
            if (p.id === master.id) roles[p.id] = 'マスター';
            else if (p.id === insider.id) roles[p.id] = 'インサイダー';
            else roles[p.id] = '庶民';
        });

        // ホスト自身の役職とお題を設定
        currentRole = roles[myId];
        currentWord = (currentRole === 'マスター' || currentRole === 'インサイダー') ? word : '';

        // ゲスト全員に個別データを送信
        broadcast({ roles, word });

        startClientGame();
    };

    function startClientGame() {
        switchScreen('screen-game');
        $('my-role').innerText = currentRole;

        if (currentRole === 'マスター' || currentRole === 'インサイダー') {
            show('my-word-container');
            $('my-word').innerText = currentWord;
        } else {
            hide('my-word-container');
        }

        if (isHost) {
            show('host-action-area');
        }
    }
</script>

</body>
</html>
